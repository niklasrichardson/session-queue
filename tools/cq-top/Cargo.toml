[package]
name = "cq-top"
version = "0.1.0"
edition = "2024"
description = "Live, read-only terminal view of a cq queue"
license = "MIT"
publish = false

[dependencies]
cq = { path = "../.." }
jiff = "0.2.38"
ratatui = "0.30.2"
# Reads the Codex and Antigravity CLI session lists read-only. Same version and features
# as cq, so no second SQLite is built.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Process CPU, memory and working folders for the Sessions screen.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3.27.0"
