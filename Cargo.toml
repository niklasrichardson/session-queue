[package]
name = "cq"
version = "1.6.0"
edition = "2024"
description = "File-based message queue for AI coding sessions"
license = "MIT"
publish = false

[workspace]
members = ["tools/cq-top"]
# A plain `cargo build`, `cargo test` and `cargo clippy` cover cq-top too.
default-members = [".", "tools/cq-top"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
notify = "8.2.0"
# Reads Codex's queue database read-only (`cq watch --to-codex`). Bundled, so no
# system SQLite is needed; no default features (no statement cache).
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Reads `sqlite_home` from Codex's config.toml, to find that database.
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
jsonschema = { version = "0.60.1", default-features = false }
tempfile = "3.27.0"

# The fake session inbox in tests/inbox.rs needs ConnectNamedPipe.
[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_IO"] }

[[bin]]
name = "cq"
path = "src/main.rs"

[lib]
name = "cq"
path = "src/lib.rs"

[profile.release]
strip = true
