name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Windows is the tested platform and must pass. macOS is partly tested
    # (issue #1: tests/dispatch.rs fails intermittently there) and Linux has
    # not been built before, so their results are shown but do not fail the
    # run. Remove an entry from `experimental` once that platform is green.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            experimental: false
          - os: macos-latest
            experimental: true
          - os: ubuntu-latest
            experimental: true
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Show toolchain
        run: rustc --version && cargo clippy --version && cargo fmt --version
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
